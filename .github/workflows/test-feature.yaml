name: PR Queue Bot-feature

on:
  schedule:
    - cron: '0 7 * * 1-5'

  workflow_dispatch:

jobs:
  check-prs-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4Expand commentComment on line R29Resolved
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
